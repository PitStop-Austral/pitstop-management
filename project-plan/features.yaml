  - id: recomendados
    title: Mantenimientos recomendados
    description: >-
      Lo que diferencia a PitStop de una planilla. Cada vehiculo tiene frecuencias de
      mantenimiento que vencen por tiempo, por kilometros o por ambos, y la app avisa
      antes de que se venzan. Regla central: una frecuencia vence por el PRIMER criterio
      que se alcanza.

      El charter la lista como Should, pero se sube a Must porque las alertas, que si
      son Must, dependen enteramente de este calculo: sin frecuencias no hay nada que
      alertar y se cae el KPI del 80%.
    sprint: 2
    linear_project: Recomendados
    moscow: must
    status: done
    features:
      - id: recomendados-frecuencias
        title: Definir una frecuencia por meses, kilómetros o ambos
        description: "El usuario elige un tipo de servicio y cada cuanto corresponde hacerlo:
          cada N meses, cada N kilometros o las dos cosas. No puede haber dos
          frecuencias del mismo tipo para el mismo vehiculo y al menos uno de los dos
          criterios tiene que estar cargado."
        status: done
        estimate: 4
        prototype:
          - components/pitstop/sheets/schedule-form.tsx
        depends_on:
          - mantenimientos-catalogo
        ticket_refs:
          - PIT-52
        starts: 2026-09-24
        ends: 2026-10-01
      - id: recomendados-calculo
        title: Calcular vencimientos y estados de las frecuencias
        description: "A partir de la ultima vez que se hizo el service y del intervalo, se
          calcula cuando y a que kilometraje toca el proximo, y cuanto falta. Vence por
          el primer criterio alcanzado. El estado es vencido si ya paso, proximo si esta
          dentro de los umbrales de anticipacion del usuario, y al dia en cualquier otro
          caso. El calculo vive en el backend para que todas las pantallas y las alertas
          usen exactamente el mismo resultado. Los umbrales de anticipacion nacen aca:
          se agregan al modelo User con sus valores por defecto, 30 dias y 1500 km, para
          que el calculo no dependa de que exista la pantalla de preferencias. Poder
          editarlos llega despues, con el perfil."
        status: done
        estimate: 4
        prototype:
          - lib/pitstop/helpers.ts
        depends_on:
          - recomendados-frecuencias
        ticket_refs:
          - PIT-53
        starts: 2026-09-24
        ends: 2026-10-01
      - id: recomendados-defaults-baseline
        title: Cargar frecuencias iniciales y reiniciar el cálculo al registrar un servicio
        description: >-
          Un vehiculo nuevo arranca con frecuencias razonables ya cargadas (cambio de
          aceite, filtro de aceite, filtro de aire, alineacion y correa de distribucion)
          para que el usuario vea valor desde el minuto cero. Las puede editar o borrar.

          Cuando se registra un mantenimiento vinculado a una frecuencia, o del mismo
          tipo, esa frecuencia toma la fecha y el kilometraje del service como nueva
          base y vuelve a contar desde ahi.

          Incluye lo que quedo afuera de los tickets de mantenimientos del Sprint 2
          semana 1: vincular un mantenimiento a su frecuencia al registrarlo o editarlo,
          mostrar en el detalle del mantenimiento la frecuencia a la que pertenece y
          cuando toca el proximo, y recalcular el proximo vencimiento cuando se edita la
          fecha o el kilometraje de un mantenimiento.
        status: done
        estimate: 3
        prototype:
          - lib/pitstop/services.ts
          - components/pitstop/store.tsx
        depends_on:
          - recomendados-calculo
          - mantenimientos-registro
          - mantenimientos-detalle-edicion
        ticket_refs:
