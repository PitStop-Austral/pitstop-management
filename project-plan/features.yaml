  - id: vehiculos
    title: Gestion de vehiculos
    description: "Requerimiento Must del charter. El usuario registra y administra sus
      vehiculos; es la base sobre la que se apoya todo lo demas: mantenimientos,
      frecuencias, deseos y accesos compartidos cuelgan de un vehiculo."
    sprint: 1
    linear_project: Vehiculos
    moscow: must
    status: todo
    features:
      - id: vehiculos-alta-edicion
        title: Registrar y editar un vehiculo
        description: >-
          Un mismo formulario para el alta y la edicion, con marca, modelo, ano,
          combustible, patente, kilometraje y un apodo opcional. Valida que el ano sea
          razonable, que la patente tenga formato argentino y que el kilometraje no sea
          negativo. Al crear uno nuevo, queda como el vehiculo activo. Solo el duenio o
          un administrador pueden editarlo.

          En mobile el formulario se abre como hoja inferior a pantalla completa con la
          accion principal siempre visible; en desktop como modal centrado.
        status: todo
        estimate: 5
        prototype:
          - components/pitstop/sheets/vehicle-form.tsx
        depends_on:
          - auth-rutas-protegidas
          - setup-monorepo
        ticket_refs: []
        starts: 2026-09-03
        ends: 2026-09-10
      - id: vehiculos-baja
        title: Eliminar un vehiculo con confirmacion explicita
        description: Borrar un vehiculo pide confirmacion y avisa que se van a perder sus
          mantenimientos, frecuencias, deseos y accesos compartidos. Si era el vehiculo
          activo, la app pasa a otro automaticamente.
        status: todo
        estimate: 2
        prototype:
          - components/pitstop/sheets/delete-vehicle-confirm.tsx
        depends_on:
          - vehiculos-alta-edicion
        ticket_refs: []
        starts: 2026-09-03
        ends: 2026-09-10
      - id: vehiculos-garage
        title: Pantalla Garage con la ficha del vehiculo y su estado general
        description: >-
          La pantalla del vehiculo activo: foto, marca, modelo, ano, combustible,
          odometro y un chip que resume si esta al dia, proximo o vencido. Menu con
          editar, compartir y eliminar. Si el usuario no tiene vehiculos, un estado
