        title: Front, API y base de datos desplegados con entornos separados
        description: >-
          apps/web en Vercel con deploy automatico al mergear a la rama principal.
          apps/api tambien en Vercel con deploy automatico pero en un proyecto diferente
          de vercel al del front, conectada a la base de produccion de Neon, con CORS
