        prototype: []
        depends_on: []
        ticket_refs:
          - PIT-29
  - id: auth
    title: Autenticacion y cuenta de usuario
    description: "Requerimiento Must del charter. Autenticacion con Firebase Auth por email
      y contrasena: Firebase maneja las credenciales, el reset y los tokens, y el
      backend valida el ID token en un guard de Nest. La API mantiene su propia tabla
      User espejada para poder relacionar vehiculos, mantenimientos y accesos
      compartidos."
    sprint: 1
    linear_project: Auth
    moscow: must
    status: todo
    features:
      - id: auth-usuario-backend
        title: Guardar al usuario de Firebase en nuestra base y proteger la API
        description: Modelo User en Prisma con el uid de Firebase, email y nombre. Un guard de
          Nest que valida el ID token en cada request protegida y, si es el primer
          login, crea el usuario en la base. Un endpoint para consultar el usuario
          autenticado.
        status: done
        estimate: 4
        prototype: []
        depends_on:
          - setup-prisma
          - setup-firebase
        ticket_refs:
          - PIT-24
        starts: 2026-08-20
        ends: 2026-08-27
      - id: auth-login-registro
        title: Pantallas de inicio de sesion y de registro
        description: >-
          Las dos pantallas comparten layout y campos, asi que se hacen juntas. Registro
          con nombre, email y contraseña; login con email y contraseña. Validacion en
          vivo de cada campo (al registrar unicamente), indicador de fuerza de la
          contrasena y mensajes de error claros cuando el email ya existe o las
          credenciales no coinciden. Al registrarse o iniciar sesion entra directo a la
          app.

          En desktop la pantalla se parte en dos con la imagen de marca a la izquierda y
          el formulario a la derecha; en mobile la imagen se muestra arriba y el
          formulario abajo.

          Se debe usar la integración de Firebase Auth previamente configurada en el
          backend.
        status: done
        estimate: 5
        prototype:
          - components/pitstop/auth/login-screen.tsx
          - components/pitstop/auth/register-screen.tsx
          - components/pitstop/auth/auth-fields.tsx
          - components/pitstop/auth/auth-layout.tsx
          - public/auth-banner.webp
        depends_on:
          - auth-usuario-backend
          - setup-app-shell
          - setup-nueva
        ticket_refs:
          - PIT-31
        starts: 2026-08-27
        ends: 2026-09-03
      - id: auth-landing
        title: Landing pública antes del inicio de sesión
        description: "Quien abre PitStop sin sesion ve primero una landing breve que explica
          para que sirve la app: guardar los vehiculos, consultar el historial de
          servicios y anticipar los proximos mantenimientos. La imagen de marca ocupa la
          primera pantalla; la accion principal lleva al registro y la secundaria al
          login. Ambas conservan el destino original cuando la persona venia de un
          enlace a una pantalla protegida. Quien ya inicio sesion entra directo a la app
          y no vuelve a ver la landing; cerrar sesion vuelve a mostrarla. La landing
          tiene una segunda seccion corta con los tres beneficios y otra accion para
          crear cuenta. No hay cabecera en la landing: el acceso a login aparece como
          boton ghost al lado de Empezar gratis dentro del hero. El logo real aparece en
          el footer, que tambien ofrece accesos a registro, login y volver arriba. Debe
          funcionar en celular y escritorio con teclado y animacion de entrada
          escalonada que respeta la preferencia de movimiento reducido."
        status: in_progress
        estimate: 2
        prototype:
          - components/pitstop/auth/landing-screen.tsx
          - components/pitstop/auth/auth-gate.tsx
          - components/pitstop/auth/auth-store.tsx
          - components/pitstop/auth/login-screen.tsx
          - public/auth-banner.webp
        depends_on:
          - auth-login-registro
          - auth-rutas-protegidas
        ticket_refs:
          - PIT-64
        starts: 2026-10-08
        ends: 2026-10-15
      - id: auth-recuperar
        title: Recuperar la cuenta por email
        description: Pantalla para pedir el mail de recuperacion, con confirmacion visible de
          que se envio. Por seguridad el mensaje es el mismo exista o no la cuenta.
          Usando Firebase Auth
        status: done
        estimate: 2
        prototype:
          - components/pitstop/auth/forgot-password-screen.tsx
        depends_on:
          - auth-login-registro
        ticket_refs:
          - PIT-32
        starts: 2026-08-27
        ends: 2026-09-03
      - id: auth-rutas-protegidas
        title: Rutas protegidas, sesion que sobrevive a recargar y cierre de sesion
        description: Quien no inicio sesion no puede entrar a ninguna pantalla de la app y se lo
          manda al login; al entrar vuelve a donde queria ir (usando params url). La
          sesion sobrevive a recargar la pagina y a cerrar el navegador, y mientras se
          resuelve si hay sesion la app muestra un estado de carga en vez de parpadear
          entre login y contenido (loader spinner). Cerrar sesion limpia todo el estado
          local y la cache de React Query. Si el token vence, se renueva solo o se lo
          manda al login.
        status: done
        estimate: 3
        prototype:
          - components/pitstop/auth/auth-gate.tsx
          - components/pitstop/auth/auth-store.tsx
        depends_on:
          - auth-login-registro
        ticket_refs:
          - PIT-33
        starts: 2026-08-27
        ends: 2026-09-03
  - id: deploy
    title: Aplicacion desplegada y accesible
    description: Que cualquiera del equipo pueda abrir PitStop desde una URL, y que cada
      pull request tenga su preview para poder revisarlo sin bajarse la rama.
    sprint: 1
    linear_project: Deploy
    moscow: must
    status: todo
    features:
      - id: deploy-web-api
        title: Front, API y base de datos desplegados con entornos separados
        description: >-
          apps/web en Vercel con deploy automatico al mergear a la rama principal.
          apps/api tambien en Vercel con deploy automatico pero en un proyecto diferente
          de vercel al del front, conectada a la base de produccion de Neon, con CORS
          configurado y un endpoint de health.

          Todas las ENV configuradas correctamente para front y back en vercel. Ningun
          secreto commiteado y un .env.example que documente todas las variables.

          Crear el proyecto de Neon y guardar sus dos connection strings, la pooled y la
