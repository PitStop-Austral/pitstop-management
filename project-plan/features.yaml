  - id: setup
    title: Setup
    description: "Item 3 del WBS. Dejar el monorepo real listo para que los devs escriban
      features sin pelearse con la infraestructura: apps/web con Vite y apps/api con
      NestJS, base de datos, Firebase, design system sobre shadcn y CI. Es lo que
      desbloquea todo el resto del proyecto, asi que va primero."
    sprint: 1
    linear_project: Setup
    moscow: must
    status: todo
    features:
      - id: setup-monorepo
        title: Crear el repo del MVP desde el template, con base local
        description: >-
          El MVP no se arma desde cero: se parte del template pitstop-stack, el mismo
          del que salio Changuito en la capacitacion. El template ya trae el monorepo de
          pnpm con Turborepo, apps/web en Vite y apps/api en NestJS, Tailwind, TanStack
          Router, TanStack Query, Oxlint, Oxfmt y la configuracion de los agentes. Nada
          de eso hay que volver a configurarlo.

          Lo que falta es lo que el template no trae: un PostgreSQL local levantado con
          Docker, igual que en el repo de capacitacion, y el .env.example junto con la
          seccion de PitStop en el README. Prisma sale de aca y tiene su propio ticket,
          que arranca apenas este repo este arriba.

          La base de Neon no se toca aca: cada dev desarrolla contra su base local, que
          puede romper y volver a crear sin molestar a nadie.
        status: done
        estimate: 3
        prototype: []
        depends_on: []
        ticket_refs:
          - PIT-20
        starts: 2026-08-20
        ends: 2026-08-27
      - id: setup-prisma
        title: Prisma conectado a la base local, con schema y migracion
        description: >-
          Con el repo creado y el Postgres local levantado, falta que la API sepa hablar
          con esa base. Prisma instalado y configurado en apps/api, el schema inicial
          con User y Vehicle, la primera migracion versionada en el repo y un seed que
          se pueda correr dos veces seguidas sin duplicar nada.

          Incluye el PrismaService y el PrismaModule global, el mismo patron que usaron
          en Changuito, para que despues los modulos de negocio lo inyecten; y un
          endpoint que lea de la base, con su test de Jest, para demostrar que la cadena
          API - Prisma - PostgreSQL cierra de punta a punta.

          El schema arranca minimo a proposito: alcanza para probar la conexion, y los
          campos que faltan los agrega cada epica en su ticket.
        status: done
        estimate: 2
        prototype: []
        depends_on:
          - setup-monorepo
        ticket_refs:
          - PIT-27
        starts: 2026-08-20
        ends: 2026-08-27
      - id: setup-ci
        title: Chequeos automaticos en cada pull request (CI)
        description: >-
          Un workflow de GitHub Actions que en cada pull request corra formato, lint,
          tipos, los tests de la API y build, y que el resultado se vea en el PR antes
          de que nadie lo mergee. Si se rompe cualquiera de los cinco, el check queda en
          rojo.

          Incluye la plantilla de pull request con la checklist de la definicion de
          terminado. El workflow no tiene que necesitar una base de datos corriendo para
          pasar. La proteccion de la rama principal ya esta configurada en GitHub y no
          se toca.
        status: done
        estimate: 1
        prototype: []
        depends_on:
          - setup-monorepo
        ticket_refs:
          - PIT-26
        starts: 2026-08-20
        ends: 2026-08-27
      - id: setup-tokens
        title: Configurar Tailwind con los tokens y el sistema de diseno de PitStop
        description: >-
          Antes de escribir un solo componente hay que dejar puestos los valores que usa
          toda la app: los colores de PitStop, las dos tipografias, los radios, las
          sombras, las animaciones y las utilidades propias, declarados con @theme de
          Tailwind v4 en apps/web/src/styles.css. Inter para el cuerpo y Space Grotesk
          para titulos y numeros, cargadas con @import de Google Fonts: apps/web es
          Vite, asi que no se usa next/font.

          Los nombres importan, porque son los que van a pedir por nombre todos los
          tickets de frontend que vienen despues. Los hexadecimales tienen que aparecer
          una sola vez en todo el repo, en styles.css. No se crea tailwind.config.js: en
          Tailwind v4 todo va en el CSS.

          El detalle de cada token esta en project-plan/design-system.md, que es la
          fuente de verdad visual del proyecto. Tema light unicamente, no hay modo
          oscuro.
        status: done
        estimate: 1
        prototype:
          - DESIGN_SYSTEM.md
          - app/globals.css
        depends_on:
          - setup-monorepo
        ticket_refs:
          - PIT-25
        starts: 2026-08-20
        ends: 2026-08-27
      - id: setup-design-system
        title: Componentes basicos de PitStop
        description: >-
          Instalar shadcn en apps/web, sobre los tokens que ya dejo puestos el trabajo
          anterior, y adaptar los componentes base que despues usan todas las pantallas:
          boton, input, select, checkbox, dialog, sheet, tabs, badge y toast. Lo que
          shadcn no tiene se escribe a mano siguiendo el prototipo: el chip de estado,
          el estado vacio y el odometro.

          Incluye los dos componentes que despues usa toda la app: Text, que pasa a ser
          la unica forma permitida de escribir texto (se le pasa una variante y un
          color, nunca clases de Tailwind sueltas), e Icon, que recibe el nombre de un
          icono de lucide-react con su tamano y su color. La app no vuelve a tener un
          <p>, un <span> ni un heading suelto: lo controla una regla de lint que ya esta
          en el template.

          Las variantes tipograficas y el detalle de que colores y que estilo de texto
          usa cada componente estan en project-plan/design-system.md.

          Cada componente tiene que resolverse en su version web y en su version mobile:
          en mobile los formularios se abren como hoja inferior y en desktop como modal
          centrado.
        status: done
        estimate: 5
        prototype:
          - DESIGN_SYSTEM.md
          - app/globals.css
          - components/pitstop/primitives.tsx
          - components/pitstop/form.tsx
          - components/pitstop/bottom-sheet.tsx
          - components/pitstop/desktop-modal.tsx
          - components/pitstop/toast-host.tsx
        depends_on:
          - setup-tokens
        ticket_refs:
          - PIT-23
        starts: 2026-08-20
        ends: 2026-08-27
      - id: setup-firebase
        title: Proyecto de Firebase con Auth y Storage listos para usar
        description: Crear el proyecto de Firebase, habilitar el proveedor de email y contrasena
          en Auth y un bucket de Storage para las fotos de vehiculos. Dejar las
          credenciales configuradas por ambiente y documentado como se consiguen, para
          que cada dev pueda levantar el suyo.
        status: done
        estimate: 2
        prototype: []
        depends_on:
          - setup-monorepo
        ticket_refs:
          - PIT-22
        starts: 2026-08-20
        ends: 2026-08-27
      - id: setup-app-shell
        title: "Navegacion de la app: barra inferior en el celular y menu lateral en la compu"
        description: "El armazon de la app: barra inferior flotante con las cuatro secciones en
          mobile (Inicio, Garage, Calendario, Perfil), sidebar left en desktop, y la
          barra superior con el vehiculo activo por ahora no debe estar. Las rutas se
          resuelven con TanStack Router, no con el estado local de tabs que usa el
          prototipo."
        status: done
        estimate: 4
        prototype:
          - components/pitstop/app-shell.tsx
          - components/pitstop/floating-navbar.tsx
          - components/pitstop/desktop-sidebar.tsx
