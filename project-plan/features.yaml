  - id: alertas
    title: Alertas y recordatorios
    description: "Requerimiento Must del charter y la razon de ser del producto: que el
      usuario no se olvide. El KPI es que al menos el 80% de las alertas termine en un
      servicio registrado dentro del plazo."
    sprint: 2
    linear_project: Alertas
    moscow: must
    status: in_progress
    features:
      - id: alertas-suscripcion
        title: Activar notificaciones y guardar el dispositivo del usuario
        description: >-
          El permiso de notificaciones se pide en un momento concreto: cuando el usuario
          termina de registrar su primer mantenimiento. Al cerrarse el formulario con
          exito aparece una hoja inferior en mobile, o un modal centrado en desktop, que
          explica para que sirven las alertas, con "Activar" y "Ahora no". No se pide
          apenas entra a la app.

          Si lo rechaza, la app sigue funcionando igual y no se le vuelve a pedir solo:
          la unica via para activarlo despues es el toggle del perfil, y la hoja se lo
          dice antes de cerrarse. Si acepta, se guarda la suscripcion del dispositivo.

          En iOS el permiso solo existe con la app instalada como PWA, asi que ahi esa
          misma hoja explica como agregarla a la pantalla de inicio en vez de pedir el
          permiso.

          El permiso del navegador se solicita solo al tocar "Activar". Configurar
          Firebase Cloud Messaging y el registro minimo del service worker necesario
          para suscribir el dispositivo. Obtener su registro de FCM y guardarlo en
          PostgreSQL mediante un endpoint autenticado, asociado al usuario. Permitir
          varios dispositivos por usuario y actualizar los registros existentes sin
          duplicarlos. Desvincular el dispositivo al cerrar sesion para que no reciba
          alertas de la cuenta anterior.

          La preferencia de notificaciones nace aca: se agrega al modelo User con su
          valor por defecto, para que el envio no dependa de que exista la pantalla de
          perfil. Guardar tambien que la invitacion ya fue mostrada, para no insistir
          automaticamente. Contemplar navegadores incompatibles. El toggle para cambiar
          la preferencia llega despues.

          Se considera terminada cuando aceptar deja el dispositivo registrado para el
          usuario autenticado, repetir el proceso no genera duplicados y rechazar
          permite seguir usando la app. La recepcion de mensajes se completa en
          alertas-recepcion-push; el cron y los envios automaticos quedan fuera.
        status: done
        estimate: 4
        prototype:
          - components/pitstop/sheets/maintenance-form.tsx
        depends_on:
          - deploy-pwa
          - mantenimientos-registro
        ticket_refs:
          - PIT-58
        starts: 2026-10-01
        ends: 2026-10-08
      - id: alertas-recepcion-push
        title: Recibir una notificación de prueba con la app cerrada
        description: >-
          Completar la integracion de Firebase Cloud Messaging con el service worker de
          la PWA para recibir mensajes en segundo plano y mostrar una notificacion del
          sistema con titulo, cuerpo e icono de PitStop. Conservar el comportamiento
          actual de instalacion y cache de la PWA.

          Definir tambien la recepcion cuando la app esta abierta, evitando mostrar dos
          veces el mismo mensaje. Preparar un mecanismo controlado de envio de prueba
          desde el backend al dispositivo guardado en alertas-suscripcion: no debe
