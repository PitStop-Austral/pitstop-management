  - id: alertas
    title: Alertas y recordatorios
    description: "Requerimiento Must del charter y la razon de ser del producto: que el
      usuario no se olvide. El KPI es que al menos el 80% de las alertas termine en un
      servicio registrado dentro del plazo."
    sprint: 2
    linear_project: Alertas
    moscow: must
    status: todo
    features:
      - id: alertas-suscripcion
        title: Activar notificaciones y guardar el dispositivo del usuario
        description: >-
          El permiso de notificaciones se pide en un momento concreto: cuando el usuario
          termina de registrar su primer mantenimiento. Al cerrarse el formulario con
          exito aparece una hoja inferior en mobile, o un modal centrado en desktop, que
          explica para que sirven las alertas, con "Activar" y "Ahora no". No se pide
          apenas entra a la app.

          Si lo rechaza, la app sigue funcionando igual y no se le vuelve a pedir solo:
          la unica via para activarlo despues es el toggle del perfil, y la hoja se lo
          dice antes de cerrarse. Si acepta, se guarda la suscripcion del dispositivo.

          En iOS el permiso solo existe con la app instalada como PWA, asi que ahi esa
          misma hoja explica como agregarla a la pantalla de inicio en vez de pedir el
          permiso.

          El permiso del navegador se solicita solo al tocar "Activar". Configurar
          Firebase Cloud Messaging y el registro minimo del service worker necesario
          para suscribir el dispositivo. Obtener su registro de FCM y guardarlo en
          PostgreSQL mediante un endpoint autenticado, asociado al usuario. Permitir
          varios dispositivos por usuario y actualizar los registros existentes sin
          duplicarlos. Desvincular el dispositivo al cerrar sesion para que no reciba
          alertas de la cuenta anterior.

          La preferencia de notificaciones nace aca: se agrega al modelo User con su
          valor por defecto, para que el envio no dependa de que exista la pantalla de
          perfil. Guardar tambien que la invitacion ya fue mostrada, para no insistir
          automaticamente. Contemplar navegadores incompatibles. El toggle para cambiar
          la preferencia llega despues.

          Se considera terminada cuando aceptar deja el dispositivo registrado para el
          usuario autenticado, repetir el proceso no genera duplicados y rechazar
          permite seguir usando la app. La recepcion de mensajes se completa en
          alertas-recepcion-push; el cron y los envios automaticos quedan fuera.
        status: done
        estimate: 4
        prototype:
          - components/pitstop/sheets/maintenance-form.tsx
        depends_on:
          - deploy-pwa
          - mantenimientos-registro
        ticket_refs:
          - PIT-58
        starts: 2026-10-01
        ends: 2026-10-08
      - id: alertas-recepcion-push
        title: Recibir una notificación de prueba con la app cerrada
        description: >-
          Completar la integracion de Firebase Cloud Messaging con el service worker de
          la PWA para recibir mensajes en segundo plano y mostrar una notificacion del
          sistema con titulo, cuerpo e icono de PitStop. Conservar el comportamiento
          actual de instalacion y cache de la PWA.

          Definir tambien la recepcion cuando la app esta abierta, evitando mostrar dos
          veces el mismo mensaje. Preparar un mecanismo controlado de envio de prueba
          desde el backend al dispositivo guardado en alertas-suscripcion: no debe
          permitir envios arbitrarios a otros usuarios ni exponer credenciales de envio
          al frontend.

          Verificar la recepcion con la pestana cerrada y, en iOS, con la PWA instalada
          y el permiso concedido. Se considera terminada cuando una push de prueba
          enviada al dispositivo registrado muestra una sola notificacion aunque la app
          este cerrada.

          Esta tarea depende de alertas-suscripcion y se planifica para la misma
          persona, primero activacion y persistencia y despues recepcion. El cron, el
          calculo diario de vencimientos, los envios automaticos y la apertura del
          destino al tocar la notificacion quedan en alertas-evaluacion-envio, para el
          15 de octubre.
        status: in_progress
        estimate: 2
        prototype: []
        depends_on:
          - alertas-suscripcion
        ticket_refs:
          - PIT-59
        starts: 2026-10-01
        ends: 2026-10-08
      - id: alertas-evaluacion-envio
        title: Enviar una alerta diaria cuando un mantenimiento esté próximo o vencido
        description: >-
          Una vez por dia se revisan todas las frecuencias de todos los usuarios y se
          determina cuales entraron en estado proximo o vencido segun los umbrales de
          cada uno. No se avisa dos veces por lo mismo.

          La notificacion dice de que vehiculo y de que service se trata, y al tocarla
          se abre directamente ese mantenimiento en la app. Respeta las preferencias del
          usuario.

          La ejecucion diaria se programa con Vercel Cron en el proyecto de la API. El
          flujo es: Vercel Cron invoca un endpoint protegido de la API, la API consulta
          las frecuencias y reutiliza el calculo de vencimientos existente, envia las
          alertas correspondientes mediante Firebase Cloud Messaging y el service worker
          de la PWA las recibe y muestra. No requiere un servidor encendido
          permanentemente ni una Cloud Function programada de Firebase.

          Configurar el cron en vercel.json y proteger el endpoint con CRON_SECRET,
          guardado como variable de entorno del backend. Documentar el horario diario y
          su equivalencia en UTC. La revision no depende de que el usuario tenga abierta
          la app; el permiso, la persistencia del dispositivo y la recepcion de prueba
          ya quedan preparados en las tareas anteriores.

          Registrar los envios para evitar notificar nuevamente el mismo vencimiento y
          contemplar reintentos o ejecuciones concurrentes del cron. Respetar la
          preferencia del usuario, gestionar registros de dispositivos invalidos y
          permitir continuar con los demas destinatarios si falla un envio. Incluir
          tests de backend para la proteccion del endpoint, la seleccion de alertas, el
          respeto de preferencias y la prevencion de duplicados.
        status: backlog
        estimate: 4
        prototype: []
        depends_on:
          - alertas-recepcion-push
          - recomendados-calculo
        ticket_refs:
          - PIT-63
        starts: 2026-10-08
        ends: 2026-10-15
  - id: kpis
    title: KPIs
    description: "Medir los indicadores de PitStop desde datos reales y preparar su futura
      publicación en la API central de Lab4. El registro de requests y los sondeos de
      health se implementan como tareas separadas; los cálculos diarios y el reporting
      se incorporarán después. Referencia: project-plan/adr/ADR-KPIs-PitStop.md.
      Proyecto de Linear: KPI Reporting. PIT-66 y PIT-67 vencen el 15 de octubre de 2026
      y se ubican en la semana del 8 al 15 de octubre. El monitoreo mantiene el alcance
      actual con artifacts de GitHub; el almacenamiento en una base separada sigue
      pendiente de decisión. Estas tareas no reemplazan el margen de Fixes y carry."
    sprint: 2
    linear_project: KPI Reporting
    moscow: must
    status: backlog
    features:
      - id: kpis-request-logging
        title: Registrar el estado HTTP y la latencia de cada request en la base de datos
        description: >-
          Crear una tabla de registros HTTP y un middleware global en la API NestJS que
          guarde una fila por request observada: método, ruta normalizada, inicio y
          final UTC, código HTTP final, duración en milisegundos y si la respuesta
          terminó o se interrumpió. Registrar respuestas exitosas, 4xx y 5xx, no
          solamente errores, para disponer del total de requests cuando se calculen los
          indicadores.

          Conservar también health y reporting, identificándolos para filtrarlos en los
          cálculos futuros. No guardar cuerpos, headers, query strings, tokens, IPs ni
          identificadores de usuarios o vehículos. Medir hasta el final de la respuesta,
          evitar duplicados entre finish y close y hacer que un fallo de persistencia no
          altere la respuesta original. Contemplar la finalización de la escritura en el
          despliegue serverless de Vercel.

          Esta tarea incluye modelo Prisma, migración, middleware, repository y pruebas
          de backend. Solo registra datos: no calcula porcentajes ni p95, no agrega
          dashboards, endpoints de KPIs, cron ni envíos a Lab4. Draft:
          project-plan/ticket-drafts/kpis-request-logging.md.
        status: backlog
        estimate: 3
        prototype: []
        depends_on: []
        ticket_refs:
          - PIT-66
        starts: 2026-10-08
        ends: 2026-10-15
      - id: kpis-health-monitor
        title: Chequear la API y la base cada 30 minutos y guardar los resultados en GitHub
        description: >-
          Crear un workflow de GitHub Actions que cada 30 minutos consulte los endpoints
          existentes /health y /health/db de PitStop. Realizar ambos chequeos en cada
          ejecución, aunque el primero falle, con timeout por request. Guardar un JSON
          con los dos resultados como artifact de esa corrida, incluyendo fecha UTC,
          código HTTP, estado y motivo de fallo.

          Preservar los resultados también ante errores HTTP, timeout o problemas de
          conexión. Distinguir un fallo del chequeo de base a través de la API de una
          caída confirmada de Neon. Permitir ejecución manual, usar nombres de artifacts
          únicos por corrida e intento y conservarlos durante 14 días.

          Reutilizar los endpoints actuales; no depende de PIT-66. Esta tarea no calcula
          disponibilidad, no guarda muestras en Neon y no publica KPIs en Lab4. Draft:
          project-plan/ticket-drafts/kpis-health-monitor.md.
        status: backlog
        estimate: 2
        prototype: []
        depends_on: []
        ticket_refs:
          - PIT-67
        starts: 2026-10-08
        ends: 2026-10-15
