# Generado por PitStop Management (npm run dev).
# Se puede editar a mano, pero la app reescribe el archivo entero al guardar,
# asi que los comentarios que agregues aca se van a perder.
meta:
  charter: ../../CLAUDE.md
  prototype_root: ../../PitStop Prototype/
  updated: 2026-10-15
  notes: >-
    Backlog de producto de PitStop. Se edita desde la app (npm run dev), no a mano: al guardar, el archivo se reescribe entero y los comentarios se pierden. Todo lo explicativo va en los campos `description` y `notes`.

    El ORDEN de los arrays es el orden de prioridad que fijo el PM. La skill `pitstop-create-linear-tickets` lo respeta al elegir que entra en la semana.

    La `description` de cada funcionalidad es el input principal del ticket: describe QUE tiene que pasar. El COMO lo escribe Claude mirando los archivos listados en `prototype`.

    Estados: `todo` (sin ticket) -> `backlog` (ticket ya creado en Linear) -> `in_progress` -> `done`. Tambien existe `blocked`.

    Estimaciones en escala 1 a 5, donde 1 SP es una hora estimada con margen para un estudiante de 3er año usando Claude Code. La calibracion esta en team.yaml, en `capacity.notes`.


    Plan local del Sprint 3: capacidad 72 SP; 68 SP por fechas, incluidas 21 SP de reservas. Semana KPI del 15 al 22: seis tareas de 3 SP, 18 SP, reparto propuesto de 6 SP por persona. Se unifican las integraciones y se incorpora evidencia/cálculo de alertas. KPI Reporting conserva 8 SP históricos y suma 26 SP. El 22–29 conserva 12 SP y la semana del 29 al 5 conserva su carga previa de 20 SP; no se mueven tareas ajenas. Fechas, línea base de valor ganado y porcentajes manuales se conservan. Carga parcial: PIT-69/PIT-71 actualizados; PIT-72/PIT-73 creados. PIT-74/PIT-75 creados para Ignacio; carga de las seis tareas completa. Detalle: project-plan/ticket-drafts/2026-10-22.md.
out_of_scope:
  - App nativa iOS / Android
  - CarPlay / Android Auto
  - Sistema de suscripcion de pago
  - Multi-idioma
  - Publicidad
  - Catalogo con todos los vehiculos del mercado
  - Adjuntar comprobantes o facturas a un mantenimiento
  - Acceso compartido a vehículos (ADR 02; fuera del MVP)
