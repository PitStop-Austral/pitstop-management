  - id: recomendados
    title: Mantenimientos recomendados
    description: >-
      Lo que diferencia a PitStop de una planilla. Cada vehiculo tiene frecuencias de
      mantenimiento que vencen por tiempo, por kilometros o por ambos, y la app avisa
      antes de que se venzan. Regla central: una frecuencia vence por el PRIMER criterio
      que se alcanza.

      El charter la lista como Should, pero se sube a Must porque las alertas, que si
      son Must, dependen enteramente de este calculo: sin frecuencias no hay nada que
      alertar y se cae el KPI del 80%.
    sprint: 2
    linear_project: Recomendados
    moscow: must
    status: todo
    features:
      - id: recomendados-frecuencias
        title: Definir una frecuencia por meses, kilómetros o ambos
        description: "El usuario elige un tipo de servicio y cada cuanto corresponde hacerlo:
          cada N meses, cada N kilometros o las dos cosas. No puede haber dos
          frecuencias del mismo tipo para el mismo vehiculo y al menos uno de los dos
          criterios tiene que estar cargado."
        status: done
        estimate: 4
        prototype:
