      - id: recomendados-calculo
        title: Calculo de vencimiento y estado al dia, proximo o vencido
        description: "A partir de la ultima vez que se hizo el service y del intervalo, se
          calcula cuando y a que kilometraje toca el proximo, y cuanto falta. Vence por
          el primer criterio alcanzado. El estado es vencido si ya paso, proximo si esta
          dentro de los umbrales de anticipacion del usuario, y al dia en cualquier otro
          caso. El calculo vive en el backend para que todas las pantallas y las alertas
          usen exactamente el mismo resultado. Los umbrales de anticipacion nacen aca:
          se agregan al modelo User con sus valores por defecto, 30 dias y 1500 km, para
