  - id: recomendados
    title: Mantenimientos recomendados
    description: >-
      Lo que diferencia a PitStop de una planilla. Cada vehiculo tiene frecuencias de mantenimiento que vencen por tiempo, por kilometros o por ambos, y la app avisa antes de que se venzan. Regla central: una frecuencia vence por el PRIMER criterio que se alcanza.

      El charter la lista como Should, pero se sube a Must porque las alertas, que si son Must, dependen enteramente de este calculo: sin frecuencias no hay nada que alertar y se cae el KPI del 80%.
