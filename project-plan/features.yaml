  - id: vehiculos
    title: Gestion de vehiculos
    description: "Requerimiento Must del charter. El usuario registra y administra sus
      vehiculos; es la base sobre la que se apoya todo lo demas: mantenimientos,
      frecuencias, deseos y accesos compartidos cuelgan de un vehiculo. Incluye tambien
      el vehiculo activo, que es un principio de producto: se elige una vez y todas las
      pantallas operan sobre esa seleccion, asi que registrar un mantenimiento nunca
      debe obligar a volver a elegir el vehiculo. Y el kilometraje, que es el dato que
      dispara la mitad de las alertas y por eso tiene que ser facil de actualizar y
      mantenerse coherente con lo que se registra."
    sprint: 1
    linear_project: Vehiculos
    moscow: must
    status: done
    features:
      - id: vehiculos-alta-edicion
        title: Registrar y editar un vehiculo
        description: >-
          Un mismo formulario para el alta y la edicion, con marca, modelo, ano,
          combustible, patente, kilometraje y un apodo opcional. Valida que el año sea
          razonable, que la patente tenga formato argentino (tanto patente nueva como
          vieja) y que el kilometraje no sea negativo. Al crear uno nuevo, queda como el
          vehiculo activo. Solo el dueño o un administrador pueden editarlo.

          En mobile el formulario se abre como hoja inferior a pantalla completa con la
          accion principal siempre visible (bottom sheet); en desktop como modal
          centrado. (modal)
        status: done
        estimate: 5
        prototype:
          - components/pitstop/sheets/vehicle-form.tsx
        depends_on:
          - auth-rutas-protegidas
          - setup-monorepo
        ticket_refs:
          - PIT-34
        starts: 2026-09-03
        ends: 2026-09-10
      - id: vehiculos-baja
        title: Eliminar un vehiculo con confirmacion
        description: Borrar un vehiculo pide confirmacion y avisa que se van a perder sus
          mantenimientos, frecuencias, deseos y accesos compartidos. Si era el vehiculo
          activo, la app pasa a otro automaticamente.
        status: done
        estimate: 2
        prototype:
          - components/pitstop/sheets/delete-vehicle-confirm.tsx
        depends_on:
          - vehiculos-alta-edicion
        ticket_refs:
          - PIT-37
        starts: 2026-09-03
        ends: 2026-09-10
      - id: vehiculos-garage
        title: Pantalla Garage con la ficha del vehiculo
        description: >-
          La pantalla del vehiculo activo: foto (por ahora debe ir una imagen de ejemplo
          mock hasta que se implemente la funcion de subir imagenes), marca, modelo,
          año, combustible, odometro y un chip que resume si esta al dia, proximo o
          vencido. Menu con editar, compartir y eliminar. Si el usuario no tiene
          vehiculos, un estado vacio que lo invite a cargar el primero.

          La barra de solapas se construye para cuatro: Informacion, Recomendados,
          Historial y Deseos. Aca va solo el armazon; el contenido de cada solapa llega
          con su propia funcionalidad, asi que la barra no se hardcodea a tres.

          En mobile la foto va arriba y el contenido debajo; en desktop la ficha queda
          fija a la izquierda y las solapas a la derecha.
        status: done
        estimate: 4
        prototype:
          - components/pitstop/screens/garage.tsx
        depends_on:
          - vehiculos-alta-edicion
          - setup-app-shell
        ticket_refs:
          - PIT-35
        starts: 2026-09-03
        ends: 2026-09-10
      - id: vehiculo-activo-selector
        title: Selector de vehiculo activo en el celular y en la compu
        description: >-
          Desde la barra superior (header) en mobile y en la sidebar en desktop, debe
          haber un selector de autos mostrando el auto actual con su foto. Al apretarlo
          se abre una lista con todos los vehiculos del usuario y se puede cambiar
          cambia el activo. Se ve cual esta seleccionado y hay un acceso directo para
          agregar uno nuevo.

          La seleccion se guarda en la cuenta, asi que se mantiene al recargar y es la
          misma si entra desde otro dispositivo. Si el vehiculo guardado ya no existe,
          cae al primero de la lista.
        status: done
        estimate: 3
        prototype:
          - components/pitstop/sheets/vehicle-picker.tsx
          - components/pitstop/top-bar.tsx
        depends_on:
          - vehiculos-garage
        ticket_refs:
          - PIT-38
        starts: 2026-09-03
        ends: 2026-09-10
      - id: kilometraje-actualizar
        title: Actualizar el kilometraje desde el odometro del Garage
        description: >-
          Un acceso directo desde el odometro del garage para poner el kilometraje
          actual. No deja cargar un valor menor al que ya estaba, porque el odometro no
          va para atras.

          Ademas, si el usuario registra un mantenimiento con un kilometraje mayor al
          del vehiculo, el odometro se actualiza solo. Es una regla del backend para que
          no dependa de que el front se acuerde de hacerlo.
        status: done
        estimate: 2
        prototype:
          - components/pitstop/sheets/update-km-form.tsx
          - components/pitstop/store.tsx
        depends_on:
          - vehiculos-garage
        ticket_refs:
          - PIT-42
        starts: 2026-09-10
        ends: 2026-09-17
  - id: ficha-tecnica
    title: Ficha tecnica del vehiculo
    description: "Requerimiento Must del charter: guardar los datos utiles del vehiculo
      (tipo de aceite, medidas, repuestos) para no tener que buscarlos cada vez que hay
