# Generado por PitStop Management (npm run dev).
# Se puede editar a mano, pero la app reescribe el archivo entero al guardar,
# asi que los comentarios que agregues aca se van a perder.
meta:
  charter: ../../CLAUDE.md
  prototype_root: ../../PitStop Prototype/
  updated: 2026-10-13
  notes: >-
    Backlog de producto de PitStop. Se edita desde la app (npm run dev), no a mano: al
    guardar, el archivo se reescribe entero y los comentarios se pierden. Todo lo
    explicativo va en los campos `description` y `notes`.

    El ORDEN de los arrays es el orden de prioridad que fijo el PM. La skill
    `pitstop-create-linear-tickets` lo respeta al elegir que entra en la semana.

    La `description` de cada funcionalidad es el input principal del ticket: describe
    QUE tiene que pasar. El COMO lo escribe Claude mirando los archivos listados en
    `prototype`.

    Estados: `todo` (sin ticket) -> `backlog` (ticket ya creado en Linear) ->
    `in_progress` -> `done`. Tambien existe `blocked`.

    Estimaciones en escala 1 a 5, donde 1 SP es una hora estimada con margen para un
    estudiante de 3er año usando Claude Code. La calibracion esta en team.yaml, en
    `capacity.notes`.


    Plan local del Sprint 3: cuatro semanas de 18 SP del 15 de octubre al 12 de
    noviembre, 72 SP incluyendo 22 SP de reserva explícita de fixes/carry.
    Núcleo KPI al 22; integración GitHub/Linear, datos y notificaciones de Perfil,
    modelo y backend de deseos al 29. Preferencias y contraseña de Perfil, frontend
    de deseos y recordatorio de km al 5. Release al 12. Perfil conserva 12 SP y
    deseos 11 SP; solo se adelantan fechas. Los 12 SP adicionales son reserva,
    no esfuerzo de funcionalidades nuevas. La instrumentación KPI histórica
    conserva sus 8 SP del Sprint 2, sin duplicarlos. Catálogo manual,
    documentación y validación integrada fuera de tickets de este equipo.
    Linear no se modifica; PIT-69 conserva una referencia y 5 SP (3 + 2).

out_of_scope:
  - App nativa iOS / Android
  - CarPlay / Android Auto
  - Sistema de suscripcion de pago
  - Multi-idioma
  - Publicidad
  - Catalogo con todos los vehiculos del mercado
  - Adjuntar comprobantes o facturas a un mantenimiento
  - Acceso compartido a vehículos (ADR 02; fuera del MVP)
