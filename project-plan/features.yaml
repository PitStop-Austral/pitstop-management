      - id: alertas-evaluacion-envio
        title: Enviar una alerta diaria cuando un mantenimiento esté próximo o vencido
        description: >-
          Una vez por dia se revisan todas las frecuencias de todos los usuarios y se
          determina cuales entraron en estado proximo o vencido segun los umbrales de
          cada uno. No se avisa dos veces por lo mismo.

          La notificacion dice de que vehiculo y de que service se trata, y al tocarla
          se abre directamente ese mantenimiento en la app. Respeta las preferencias del
          usuario.

          La ejecucion diaria se programa con Vercel Cron en el proyecto de la API. El
          flujo es: Vercel Cron invoca un endpoint protegido de la API, la API consulta
          las frecuencias y reutiliza el calculo de vencimientos existente, envia las
          alertas correspondientes mediante Firebase Cloud Messaging y el service worker
          de la PWA las recibe y muestra. No requiere un servidor encendido
          permanentemente ni una Cloud Function programada de Firebase.

          Configurar el cron en vercel.json y proteger el endpoint con CRON_SECRET,
          guardado como variable de entorno del backend. Documentar el horario diario y
          su equivalencia en UTC. La revision no depende de que el usuario tenga abierta
          la app; el permiso, la persistencia del dispositivo y la recepcion de prueba
          ya quedan preparados en las tareas anteriores.

          Registrar los envios para evitar notificar nuevamente el mismo vencimiento y
          contemplar reintentos o ejecuciones concurrentes del cron. Respetar la
          preferencia del usuario, gestionar registros de dispositivos invalidos y
          permitir continuar con los demas destinatarios si falla un envio. Incluir
          tests de backend para la proteccion del endpoint, la seleccion de alertas, el
          respeto de preferencias y la prevencion de duplicados.
