        starts: 2026-08-27
        ends: 2026-09-03
      - id: setup-nueva
        title: Cliente de Axios que manda el token de Firebase en cada pedido
        description: "Capa de datos del frontend: cliente de Axios reutilizable que agrega el
          token de Firebase a cada request (se debe poder evitar que se agregue el token
          de Firebase para los casos de enpoints que no requieren autenticacion como
          login, register y forgot-password, pero por defecto si debe enviar el token de
          Firebase) y normaliza los errores de la API, React Query configurado para los
          estados de carga y error, y el manejo del 401 (Hacer logout)"
        status: done
        estimate: 1
        starts: 2026-08-27
