          frecuencias, fechas ni kilometrajes al guardar. Reutilizar el cálculo
          centralizado de vencimientos y refrescar Recomendados, Inicio y Calendario; la
          evaluación diaria de alertas debe leer la preferencia vigente. Cancelar no
