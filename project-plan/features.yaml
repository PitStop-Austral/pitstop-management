          Cuando se registra un mantenimiento vinculado a una frecuencia, o del mismo tipo, esa frecuencia toma la fecha y el kilometraje del service como nueva base y vuelve a contar desde ahi.

          Incluye lo que quedo afuera de los tickets de mantenimientos del Sprint 2 semana 1: vincular un mantenimiento a su frecuencia al registrarlo o editarlo, mostrar en el detalle del mantenimiento la frecuencia a la que pertenece y cuando toca el proximo, y recalcular el proximo vencimiento cuando se edita la fecha o el kilometraje de un mantenimiento.
