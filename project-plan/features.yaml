          base y vuelve a contar desde ahi.

          Incluye lo que quedo afuera de los tickets de mantenimientos del Sprint 2
          semana 1: vincular un mantenimiento a su frecuencia al registrarlo o editarlo,
          mostrar en el detalle del mantenimiento la frecuencia a la que pertenece y
          cuando toca el proximo, y recalcular el proximo vencimiento cuando se edita la
          fecha o el kilometraje de un mantenimiento.
        status: done
        estimate: 3
        prototype:
          - lib/pitstop/services.ts
          - components/pitstop/store.tsx
        depends_on:
          - recomendados-calculo
          - mantenimientos-registro
