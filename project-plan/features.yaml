  - id: recordatorio-km
    title: Recordatorio de actualizacion de kilometraje
    description: Si hace mucho que el usuario no actualiza el odometro de un vehiculo, se le
      recuerda, porque sin ese dato las alertas por kilometros dejan de servir. El
      charter lo lista como Could y quedo fuera del MVP. Planificado como extra en la
      tercera semana; antes de emitir el ticket el PO debe fijar umbral y repetición. Si
      no se resuelve esa decisión, sus 2 SP se dedican a defectos reales del piloto y no
      se consideran una funcionalidad terminada.
    sprint: 3
    linear_project: Recordatorio de km
    moscow: could
    status: todo
    features:
      - id: recordatorio-km-push
        title: Recordatorio periodico para actualizar el kilometraje
        description: >-
          Objetivo opcional: reutilizar el cron y el canal push de alertas para recordar
          la actualización de kilometraje cuando transcurre el período de inactividad
          acordado. Antes de crear el ticket, el PO debe definir cuántos días activan el
          recordatorio y cuándo se permite repetirlo: el plan actual no fija esos
          valores. El timestamp debe corresponder a la última actualización explícita
          del odómetro, no al updatedAt genérico del vehículo; agregar ese dato si aún
          no existe.


          Evaluar vehículos accesibles y destinatarios habilitados con la política de
          permisos existente; respetar preferencia de notificaciones y registros de
          dispositivos válidos. Conservar evidencia y clave de deduplicación por
          vehículo/período para que reintentos o cron concurrente no generen el mismo
          aviso dos veces. Actualizar kilometraje reinicia la ventana.


          Al tocar la push, abrir el formulario de kilometraje del vehículo indicado,
          resolviendo autenticación y autorización antes de mostrarlo. Un vehículo
          eliminado o inaccesible lleva a un estado seguro. Criterios de aceptación:
          antes del umbral no se envía, al alcanzarlo se emite una sola vez, apagar
          notificaciones lo impide y actualizar el odómetro reinicia el plazo. Probar
          límites temporales, deduplicación y deep link con la app cerrada. No sumar un
          segundo scheduler. Fuera del MVP; no comprometer fechas de ejecución sin
          definir el umbral.
        status: todo
        estimate: 2
        prototype:
          - components/pitstop/sheets/update-km-form.tsx
        depends_on:
          - alertas-evaluacion-envio
          - kilometraje-actualizar
          - perfil-notificaciones
