    title: Ficha tecnica del vehiculo
    description: "Requerimiento Must del charter: guardar los datos utiles del vehiculo (tipo de aceite, medidas, repuestos) para no tener que buscarlos cada vez que hay que hacerle un service."
    sprint: 1
    linear_project: Ficha tecnica
    moscow: must
    status: done
    features:
      - id: ficha-datos
        title: "Cargar la ficha tecnica del vehiculo: aceites, transmision, neumaticos y luces"
        description: >-
          Todo en el mismo formulario de creacion y edicion del vehiculo, agrupado por tipo y con todos los campos opcionales. Cada seccion debe usar su imagen correspondiente (se adjuntan en el ticket):

          Lubricantes y transmision: tipo y cantidad en litros del aceite de motor y del de caja, y tipo de transmision (manual, automatica).

          Neumaticos: medida (ancho, talon y radio) y presion recomendada en PSI, por separado para los delanteros y los traseros, porque no siempre coinciden.

          Luces: el modelo de lampara de las altas, las bajas y las antiniebla (texto libre)
        status: done
