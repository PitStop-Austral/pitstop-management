week:
  starts_on: thursday
  length_days: 7
  notes: "Las semanas del equipo van de jueves a jueves. Los tickets se cargan antes del
    jueves de arranque y vencen el jueves siguiente: si se crean el lunes 10, los devs
    arrancan el jueves 13 y la fecha limite es el jueves 20."
capacity:
  developers: 3
  points_per_developer_per_week: 6
  total_points_per_week: 18
  buffer_ratio: 0
  scale: 1 SP = 1 hora estimada con margen
  allowed_estimates:
    - 1
    - 2
    - 3
    - 4
    - 5
  notes: >-
    Cada dev de Lab2 trabaja 6 horas semanales (restriccion del charter), o sea 6 SP. La
    estimacion se hace pensando en un estudiante de 3er año de ingenieria informatica,
    sin experiencia laboral, que usa Claude Code, y se redondea para arriba: la idea es
    que esos 6 SP se resuelvan en 4 o 4,5 horas reales y que el resto quede como margen
    para lo que se complique.

    Calibracion: 1 = configuracion o cambio acotado que Claude Code resuelve casi
    entero. 2 = una pantalla simple o un endpoint con su modelo, sobre un patron que ya
    vieron. 3 = vertical completa estandar (modelo, endpoint y pantalla). 4 = vertical
    con algo nuevo que hay que aprender primero. 5 = lo mas grande permitido: algo nuevo
    mas varias piezas.

    El margen del sprint no es un porcentaje sino trabajo con nombre: cada sprint tiene
    su epica de fixes y carry, con un ticket en la ultima semana, para los arreglos que
    hayan aparecido y para lo que se haya alargado. Por eso `buffer_ratio` esta en 0 y
    el cronograma planifica los 18 SP completos.
