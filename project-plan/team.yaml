definition_of_done:
  - Existe una rama `feat/PIT-XX-descripcion` con el trabajo.
  - El PR fue aprobado por un companero y mergeado.
  - "`npm run build` pasa sin errores de TypeScript."
  - Lo que agrega o cambia un endpoint tiene sus tests de Jest en el mismo ticket. El
    frontend no lleva tests automatizados.
  - La funcionalidad se probo corriendo la app, no solo compilando.
  - El dev puede explicar que hace el codigo.
