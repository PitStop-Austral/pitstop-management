# Generado por PitStop Management (npm run dev).
# Se puede editar a mano, pero la app reescribe el archivo entero al guardar,
# asi que los comentarios que agregues aca se van a perder.
meta:
  updated: 2026-10-13
  notes: "Equipo, capacidad y coordenadas del proyecto. Se edita desde la app (npm run
    dev): al guardar, el archivo se reescribe entero. Los ids de Linear fueron
    verificados contra el workspace pitstop-austral."
project:
  name: PitStop
  charter: ../../CLAUDE.md
  prototype: ../../PitStop Prototype/
  training: ../../capacitacion/
  prototype_notes: El prototipo es la especificacion de UI del MVP, no su implementacion.
    Corre sobre Next.js con datos mock; el MVP real se escribe en Vite + TanStack
    Router. El comportamiento se copia, la implementacion se traduce.
  repos:
    monorepo:
      url: https://github.com/PitStop-Austral/pitstop-app
      local_path: ../pitstop-app
      apps:
        web: apps/web
        api: apps/api
    template:
      url: https://github.com/ManuLosta/pitstop-stack
      local_path: ../../pitstop-stack
      notes: El repo del MVP se crea desde este template con `pnpm dlx create-turbo@latest
        --example <url>`, eligiendo pnpm. Ya trae el workspace de pnpm con Turborepo,
        apps/web (Vite + React + Tailwind + TanStack Router + TanStack Query), apps/api
        (NestJS + Jest), Oxlint, Oxfmt y la configuracion de los agentes (.claude,
        .codex, .agents, .mcp.json con Context7 y CodeGraph). NO trae .github (ni CI ni
        plantilla de PR), Vitest en web, .env.example, Prisma ni shadcn.
        PitStop-Austral/changuito es una copia de este template, hoy identica en todo lo
        que importa.
  stack:
    workspace:
      - pnpm
      - Turborepo
    frontend:
      - Vite
      - React
      - TypeScript
      - Tailwind CSS
      - TanStack Router
      - TanStack Query
      - "@base-ui/react"
      - Axios
      - Zod
    backend:
      - NestJS
      - TypeScript
      - Prisma
      - class-validator
    lint: Oxlint
    format: Oxfmt
    database: PostgreSQL (Neon)
    auth: Firebase Auth (email + password)
    storage: Firebase Storage
    hosting: Vercel
    ci: GitHub Actions
    tests: Jest en la API, que ya viene en el template. El frontend no lleva tests
      automatizados.
  ui_notes: >-
    Los componentes del frontend parten del primitivo de @base-ui/react cuando existe y
    despues se adaptan a la identidad del prototipo (tokens, radios, tipografia). Asi
    estan hechos el menu desplegable y el selector. Solo se escribe desde cero lo que
    Base UI no trae: la hoja inferior, el odometro, el selector de servicios y las
    tarjetas de mantenimiento.

    Cada componente se resuelve en su version web y en su version mobile, porque varios
    cambian de forma: hoja inferior en mobile y modal en desktop, barra inferior y
    sidebar, tarjetas apiladas y grilla.
  forbidden_dependencies:
    - SWR
    - Zustand
    - Redux
    - MUI
    - Chakra
    - Bootstrap
    - ESLint
    - Prettier
    - React Router
  forbidden_notes: "capacitacion/APP-CONTEXT.md tambien prohibe React Query, pero eso
    aplica al proyecto de practica (Changuito), no al MVP: aca esta permitido. La
    libreria de componentes del MVP es @base-ui/react, no shadcn ni Radix: se verifico
    el 2026-09-08 contra apps/web/package.json y ninguna de las dos esta instalada.
    ESLint y Prettier estan prohibidos porque el template usa Oxlint y Oxfmt con la
    configuracion en la raiz. React Router esta prohibido porque el ruteo lo resuelve
    TanStack Router, que ya viene en el template."
