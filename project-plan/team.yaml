      - Lista de deseos
      - Recordatorio de km
      - Fixes - S3
      - KPI Reporting
    notes: "Capacidad 72 SP, tres desarrolladores de 6 SP semanales. Semana KPI del 15–22: seis tareas de 3 SP, 18 SP. Reparto propuesto: Manuel Gioino PIT-69/PIT-71 (6), Juan Cruz García Ferrer disponibilidad/alertas (6), Ignacio Siaba GitHub/integración conjunta (6). Las dos integraciones anteriores se sustituyen por una; la evidencia de alertas se agrega con migración y pruebas y completa el cálculo en PIT-69. Dependencias entre personas coordinadas por contrato/fixtures y validación conjunta final. PIT-67 sigue In Progress; PIT-63/66/68 se reutilizan como Done. KPIs GitHub: ci_success_rate y mean_time_to_merge, sin integración de datos Linear. Sprint 3 por fechas 68 SP, incluidas reservas 21, frente a capacidad 72; se conservan las cargas y fechas ajenas a estos drafts. No se modifica valor ganado ni porcentajes manuales del cronograma. Pendientes de revisión: regla de plazo de alertas y atribución del ambiente del monitor. Carga parcial verificada: PIT-69/PIT-71 actualizados, PIT-72/PIT-73 creados; PIT-74/PIT-75 creados; las seis tareas están sincronizadas."
